# MODX MCP SOURCE / ИСХОДНИК MODX MCP
# RU: Одноразовая проверка Node lock; workflow ничего не записывает в GitHub.
# EN: Temporary read-only Node dependency refresh; no repository writes.
name: Candidate Node lock refresh (read-only handoff)

on:
  push:
    branches: ['fix/128-release-gates-006-007-node-lock-20261123']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate fully audited lockfile without source push
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm pkg set "dependencies.@modelcontextprotocol/sdk=1.32.2"
          npm pkg set "dependencies.axios=1.21.1"
          npm install --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
          node --check client/index.js
          python3 _build/test.cas-client-contract.py
          node _build/test.error-presenter.cjs
          python3 - <<'PY'
          import base64,pathlib
          for name in ('package.json','package-lock.json'):
              data=pathlib.Path(name).read_bytes()
              print('MODXMCP_REFRESH_BEGIN',name)
              print('MODXMCP_REFRESH_DATA',name,base64.b64encode(data).decode('ascii'))
              print('MODXMCP_REFRESH_END',name)
          PY
