# MODX MCP SOURCE / ИСХОДНИК MODX MCP
# RU: CI-процедура MODX MCP; проверки и сборка не должны менять production.
# EN: MODX MCP CI workflow; testing and packaging must not modify production.
name: Build and verify MODX MCP 1.2.8-beta5 candidates (unpublished)

# This workflow only builds downloadable Actions artifacts on disposable MODX.
# It never creates a GitHub release or tag and never accesses production.
on:
  workflow_dispatch:
  push:
    branches: ['release/1.2.8-beta5-candidate-20261124']

permissions:
  contents: read

jobs:
  build:
    name: Disposable ${{ matrix.platform }} / PHP ${{ matrix.php_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # RU: PHP 8.4 — исследовательский тест, не блокирующий релизную матрицу.
    # EN: PHP 8.4 is exploratory, not a declared supported release target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: modx2, modx_version: '2.8.9', php_version: '8.2', signature: 'modx2mcp-1.2.7-pl'}
          - {platform: modx3, modx_version: '3.2.4', php_version: '8.2', signature: 'modx3mcp-1.2.7-pl'}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway-only-root
          MARIADB_DATABASE: modx_build
          MARIADB_USER: modx_ci
          MARIADB_PASSWORD: ci-throwaway-only-user
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli, pdo_mysql, sodium, zip, gd, intl, mbstring, xml
          coverage: none
      - name: Validate and stage release source
        run: |
          set -euo pipefail
          python3 _build/test.release-staging.py
          python3 _build/test.capabilities-cas-metadata.py
          python3 _build/prepare-release.py --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/modxmcp-stage"
          grep -Fq "define('PKG_VERSION', '1.2.7');" "$RUNNER_TEMP/modxmcp-stage/_build/build.config.php"
          grep -Fq "define('PKG_RELEASE', 'pl');" "$RUNNER_TEMP/modxmcp-stage/_build/build.config.php"
      - name: Install official MODX on disposable CI database
        env:
          MODX_VERSION: ${{ matrix.modx_version }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://modx.s3.amazonaws.com/releases/${MODX_VERSION}/modx-${MODX_VERSION}-pl.zip" \
            -o "$RUNNER_TEMP/modx.zip"
          mkdir -p "$RUNNER_TEMP/modx-extract" "$RUNNER_TEMP/modx-site"
          unzip -q "$RUNNER_TEMP/modx.zip" -d "$RUNNER_TEMP/modx-extract"
          found="$(find "$RUNNER_TEMP/modx-extract" -type f -path '*/setup/index.php' -print -quit)"
          if [ -z "$found" ]; then echo 'MODX setup missing'; exit 1; fi
          root="$(dirname "$(dirname "$found")")"
          cp -a "$root"/. "$RUNNER_TEMP/modx-site/"
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as E
          site=pathlib.Path(os.environ['RUNNER_TEMP'])/'modx-site'
          values={
             'database_type':'mysql','database_server':'127.0.0.1:3306',
             'database':'modx_build','database_user':'modx_ci',
             'database_password':'ci-throwaway-only-user',
             'database_connection_charset':'utf8mb4',
             'database_charset':'utf8mb4','database_collation':'utf8mb4_unicode_ci',
             'table_prefix':'modx_', 'inplace':'1', 'unpacked':'0',
             'language':'en','cmsadmin':'testadmin',
             'cmspassword':'ci-throwaway-admin-only',
             'cmsadminemail':'ci@example.invalid',
             'remove_setup_directory':'0','http_host':'localhost',
             'context_web_path':str(site)+'/', 'context_web_url':'/',
             'core_path':str(site/'core')+'/',
             'context_mgr_path':str(site/'manager')+'/',
             'context_mgr_url':'/manager/',
             'context_connectors_path':str(site/'connectors')+'/',
             'context_connectors_url':'/connectors/',
             'assets_path':str(site/'assets')+'/', 'assets_url':'/assets/',
          }
          parent=E.Element('modx')
          for key,value in values.items():E.SubElement(parent,key).text=value
          E.ElementTree(parent).write(site/'setup/config.xml',encoding='utf-8',xml_declaration=True)
          PY
          (cd "$RUNNER_TEMP/modx-site/setup" && php ./index.php --installmode=new)
          test -f "$RUNNER_TEMP/modx-site/config.core.php"
          test -f "$RUNNER_TEMP/modx-site/core/config/config.inc.php"
      - name: Build and install the authentic v1.2.7 transport
        env:
          BUILD_PLATFORM: '${{ matrix.platform }}'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-127"
          git archive v1.2.7 | tar -x -C "$RUNNER_TEMP/source-127"
          python3 "$RUNNER_TEMP/source-127/_build/prepare-release.py" \
            --platform "$BUILD_PLATFORM" --output "$RUNNER_TEMP/stage-127"
          grep -Fq "define('PKG_VERSION', '1.2.7');" \
            "$RUNNER_TEMP/stage-127/_build/build.config.php"
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/stage-127/_build/build.transport.php"
          old="$BUILD_PLATFORM"
          zip="$RUNNER_TEMP/modx-site/core/packages/${old}mcp-1.2.7-pl.transport.zip"
          test -s "$zip"
          php "$RUNNER_TEMP/stage-127/_build/install.transport.php" \
            --signature="${old}mcp-1.2.7-pl"
          MODXMCP_DISPOSABLE_CI=1 php _build/test.ci-true-upgrade-127-to-128.php before
          MODXMCP_DISPOSABLE_CI=1 php _build/test.ci-upgrade-acl-migration.php before
      - name: Build a separate unpublished 1.2.8-beta5 transport on the disposable MODX
        env:
          BUILD_PLATFORM: '${{ matrix.platform }}'
        run: |
          set -euo pipefail
          python3 _build/prepare-release.py \
            --platform "$BUILD_PLATFORM" --output "$RUNNER_TEMP/stage-128"
          python3 - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage-128'
          changes=[
             (root/'_build/build.config.php',
              r"define\('PKG_VERSION',\s*'1\.2\.7'\);",
              "define('PKG_VERSION', '1.2.8');"),
             (root/'_build/build.config.php',
              r"define\('PKG_RELEASE',\s*'pl'\);",
              "define('PKG_RELEASE', 'beta5');"),
             (root/'core/components/modxmcp/model/modxmcp.class.php',
              r"const VERSION = '1\.2\.7';",
              "const VERSION = '1.2.8';")
          ]
          for path,pattern,replacement in changes:
              content=path.read_text(encoding='utf-8')
              updated,count=re.subn(pattern,replacement,content)
              if count!=1:raise SystemExit('Version marker mismatch: '+str(path))
              path.write_text(updated,encoding='utf-8')
          PY
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          # RU: Не допускаем Python-helper в новый транспорт.
          # EN: Verify PHP-only component source reader in the transport source.
          grep -Fq 'function readComponentFileChecked(' \
            "$RUNNER_TEMP/stage-128/core/components/modxmcp/src/Tools/FilesystemSupport.php"
          test ! -f "$RUNNER_TEMP/stage-128/core/components/modxmcp/src/Security/component_read_guard.py"
          php "$RUNNER_TEMP/stage-128/_build/build.transport.php"
          zip="$RUNNER_TEMP/modx-site/core/packages/${BUILD_PLATFORM}mcp-1.2.8-beta5.transport.zip"
          test -s "$zip"
          unzip -t "$zip" | tail -3
          grep -Fq "define('PKG_VERSION', '1.2.8');" "$RUNNER_TEMP/stage-128/_build/build.config.php"
          grep -Fq "define('PKG_RELEASE', 'beta5');" "$RUNNER_TEMP/stage-128/_build/build.config.php"
          grep -Fq "const VERSION = '1.2.8';" "$RUNNER_TEMP/stage-128/core/components/modxmcp/model/modxmcp.class.php"
          php "$RUNNER_TEMP/stage-128/_build/install.transport.php" \
            --signature="${BUILD_PLATFORM}mcp-1.2.8-beta5"
      # RU: Существующие ACL-строки из 1.2.7, явный DDL только в disposable DB.
      # EN: Verify actual historical ACL rows survive new transport and explicit index migration.
      - name: Historical ACL data and explicit index migration on upgraded disposable MODX
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php _build/migrate-acl-index.php --check | grep -E 'ACL_INDEX_MIGRATION_(REQUIRED|ALREADY_PRESENT)'
          if php _build/migrate-acl-index.php --apply; then
            echo "Unacknowledged migration unexpectedly succeeded" >&2
            exit 1
          fi
          php _build/migrate-acl-index.php --apply --ci-disposable | grep -E 'ACL_INDEX_MIGRATION_(APPLIED|ALREADY_PRESENT)'
          php _build/migrate-acl-index.php --check | grep 'ACL_INDEX_MIGRATION_ALREADY_PRESENT'
          php _build/migrate-acl-index.php --apply --ci-disposable | grep 'ACL_INDEX_MIGRATION_ALREADY_PRESENT'
          php _build/test.ci-upgrade-acl-migration.php after
      - name: Verify token settings CAS and legacy read compatibility
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php _build/test.ci-true-upgrade-127-to-128.php after
          php -d disable_functions=proc_open,exec,shell_exec,system _build/test.static-portable-replace.php
          php -d disable_functions=proc_open,exec,shell_exec,system _build/test.media-assets-policy.php
          # Verify the installed portable implementation matches tested source.
          cmp core/components/modxmcp/src/Tools/StaticFileWriteSupport.php "$RUNNER_TEMP/modx-site/core/components/modxmcp/src/Tools/StaticFileWriteSupport.php"
          cmp core/components/modxmcp/src/Tools/MediaSourceSupport.php "$RUNNER_TEMP/modx-site/core/components/modxmcp/src/Tools/MediaSourceSupport.php"

      - name: Package verified Beta candidate and SHA256
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          sig="${BUILD_PLATFORM}mcp-1.2.8-beta5"
          package="$RUNNER_TEMP/modx-site/core/packages/$sig.transport.zip"
          test -s "$package"
          mkdir -p "$RUNNER_TEMP/beta-artifacts"
          cp "$package" "$RUNNER_TEMP/beta-artifacts/"
          (
            cd "$RUNNER_TEMP/beta-artifacts"
            sha256sum "$sig.transport.zip" > SHA256SUMS
            sha256sum -c SHA256SUMS
            printf '%s\n' "${GITHUB_SHA}" > SOURCE_COMMIT.txt
          )
      - name: Upload verified platform ZIP (never publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}mcp-1.2.8-beta5-VERIFIED
          path: ${{ runner.temp }}/beta-artifacts/
          if-no-files-found: error
          retention-days: 90

  client:
    name: Node MCP client package / Beta 5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Node client and build isolated prerelease package
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # The committed lockfile is already audited. DO NOT mutate it here.
          npm audit --omit=dev --audit-level=moderate
          npm ls @modelcontextprotocol/sdk axios
          # Report exact dependency advisories for the release gate.
          # Audit findings are reviewed separately; do not hide npm warnings.
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'npm-audit.json').read_text())
          for name,detail in sorted(report.get('vulnerabilities',{}).items()):
              if detail.get('severity') in ('high','critical'):
                  via=detail.get('via',[])
                  advisories=[v.get('title','') for v in via if isinstance(v,dict)]
                  print('BETA_NODE_AUDIT', name, detail.get('severity'),
                        'direct='+str(detail.get('isDirect')),
                        'fix='+str(detail.get('fixAvailable')),
                        'advisories='+repr(advisories[:2]))
          print('BETA_NODE_AUDIT_SUMMARY',
                json.dumps(report.get('metadata',{}).get('vulnerabilities',{}),sort_keys=True))
          PY
          node --check client/index.js
          python3 _build/test.cas-client-contract.py
          node _build/test.error-presenter.cjs
          # Only the ephemeral checkout is changed. The public stable
          # package.json / lockfile remain 1.2.7 until an approved release.
          # Pin the validated direct dependency versions in the Beta tarball
          # so users do not resolve the known-vulnerable minimum versions.
          sdk_version="$(node -p 'JSON.parse(require("fs").readFileSync("./node_modules/@modelcontextprotocol/sdk/package.json","utf8")).version')"
          axios_version="$(node -p 'JSON.parse(require("fs").readFileSync("./node_modules/axios/package.json","utf8")).version')"
          npm pkg set version=1.2.8-beta.5
          npm pkg set "dependencies.@modelcontextprotocol/sdk=$sdk_version" "dependencies.axios=$axios_version"
          echo "BETA_NODE_PINNED_DIRECT_DEPS sdk=$sdk_version axios=$axios_version"
          # npm pack excludes package-lock.json; shrinkwrap preserves the
          # audited transitive graph in the distributed command-line package.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm shrinkwrap
          npm audit --omit=dev --audit-level=moderate
          # This package's files allowlist would otherwise omit shrinkwrap.
          npm pkg set "files[3]=npm-shrinkwrap.json"
          mkdir -p "$RUNNER_TEMP/client-artifacts"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/client-artifacts"
          file="$RUNNER_TEMP/client-artifacts/modx3-mcp-1.2.8-beta.5.tgz"
          test -s "$file"
          # Avoid grep -q + pipefail SIGPIPE from tar when the file is found.
          tar -tzf "$file" > "$RUNNER_TEMP/client-manifest.txt"
          grep -Fxq 'package/client/index.js' "$RUNNER_TEMP/client-manifest.txt"
          grep -Fxq 'package/npm-shrinkwrap.json' "$RUNNER_TEMP/client-manifest.txt"
          (
            cd "$RUNNER_TEMP/client-artifacts"
            sha256sum "$(basename "$file")" > SHA256SUMS
            sha256sum -c SHA256SUMS
            printf '%s\n' "${GITHUB_SHA}" > SOURCE_COMMIT.txt
          )
      - name: Upload matching Node MCP client
        uses: actions/upload-artifact@v4
        with:
          name: modx-mcp-client-1.2.8-beta5-VERIFIED
          path: ${{ runner.temp }}/client-artifacts/
          if-no-files-found: error
          retention-days: 90

