name: Build test transport packages (isolated)

on:
  push:
    branches: ['feature/mcp-security-hardening']
    paths:
      - '.github/workflows/build-test-transports.yml'
      - '_build/smoke.protected-boundary.php'
      - '_build/smoke.endpoint.php'
      - 'core/components/modxmcp/endpoint/api.common.php'
      - 'core/components/modxmcp/endpoint/chunk-cas.php'
      - 'tests/live-chunk-cas-innodb.php'
      - 'core/components/modxmcp/model/modxmcp.class.php'
      - 'core/components/modxmcp/legacy/modx2/modxmcp.class.php'
  workflow_dispatch:

jobs:
  build:
    name: Build MODX MCP 1.2.5 for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: modx2
            modx_version: '2.8.9'
            php_version: '7.4'
            signature: 'modx2mcp-1.2.5-pl'
          - platform: modx3
            modx_version: '3.2.4'
            php_version: '8.2'
            signature: 'modx3mcp-1.2.5-pl'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway-only-root
          MARIADB_DATABASE: modx_build
          MARIADB_USER: modx_ci
          MARIADB_PASSWORD: ci-throwaway-only-user
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v1.2.4 is needed for the real 2.8.9 upgrade regression
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli, pdo_mysql, zip, gd, intl, mbstring, xml
          coverage: none
      - name: Prepare platform-specific source tree
        run: |
          python3 _build/prepare-release.py --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/modxmcp-stage"
          python3 _build/test.cas-pilot-disconnected.py
      - name: Install official MODX on disposable CI database
        env:
          MODX_VERSION: ${{ matrix.modx_version }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://modx.s3.amazonaws.com/releases/${MODX_VERSION}/modx-${MODX_VERSION}-pl.zip" \
            -o "$RUNNER_TEMP/modx.zip"
          mkdir -p "$RUNNER_TEMP/modx-extract" "$RUNNER_TEMP/modx-site"
          unzip -q "$RUNNER_TEMP/modx.zip" -d "$RUNNER_TEMP/modx-extract"
          found="$(find "$RUNNER_TEMP/modx-extract" -type f -path '*/setup/index.php' -print -quit)"
          if [ -z "$found" ]; then echo 'MODX setup missing'; exit 1; fi
          root="$(dirname "$(dirname "$found")")"
          cp -a "$root"/. "$RUNNER_TEMP/modx-site/"
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as E
          site=pathlib.Path(os.environ['RUNNER_TEMP'])/'modx-site'
          values={
             'database_type':'mysql','database_server':'127.0.0.1:3306',
             'database':'modx_build','database_user':'modx_ci',
             'database_password':'ci-throwaway-only-user',
             'database_connection_charset':'utf8mb4',
             'database_charset':'utf8mb4','database_collation':'utf8mb4_unicode_ci',
             'table_prefix':'modx_', 'inplace':'1', 'unpacked':'0',
             'language':'en','cmsadmin':'testadmin',
             'cmspassword':'ci-throwaway-admin-only',
             'cmsadminemail':'ci@example.invalid',
             'remove_setup_directory':'0','http_host':'localhost',
             'context_web_path':str(site)+'/', 'context_web_url':'/',
             'core_path':str(site/'core')+'/',
             'context_mgr_path':str(site/'manager')+'/',
             'context_mgr_url':'/manager/',
             'context_connectors_path':str(site/'connectors')+'/',
             'context_connectors_url':'/connectors/',
             'assets_path':str(site/'assets')+'/', 'assets_url':'/assets/',
          }
          parent=E.Element('modx')
          for key,value in values.items():E.SubElement(parent,key).text=value
          E.ElementTree(parent).write(site/'setup/config.xml',encoding='utf-8',xml_declaration=True)
          PY
          (cd "$RUNNER_TEMP/modx-site/setup" && php ./index.php --installmode=new)
          test -f "$RUNNER_TEMP/modx-site/config.core.php"
          test -f "$RUNNER_TEMP/modx-site/core/config/config.inc.php"
      - name: Real InnoDB CAS regression on disposable MODX chunk table
        env:
          MODXMCP_CI_DB_HOST: 127.0.0.1
          MODXMCP_CI_DB_NAME: modx_build
          MODXMCP_CI_DB_USER: modx_ci
          MODXMCP_CI_DB_PASSWORD: ci-throwaway-only-user
        run: php tests/live-chunk-cas-innodb.php
      - name: Install previous 1.2.4 in MODX 2 to test real upgrade
        if: matrix.platform == 'modx2'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modxmcp-v124"
          git archive v1.2.4 | tar -x -C "$RUNNER_TEMP/modxmcp-v124"
          python3 "$RUNNER_TEMP/modxmcp-v124/_build/prepare-release.py" \
            --platform modx2 --output "$RUNNER_TEMP/modxmcp-v124-stage"
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-v124-stage/_build/build.transport.php"
          php "$RUNNER_TEMP/modxmcp-v124-stage/_build/install.transport.php" \
            --signature=modx2mcp-1.2.4-pl
          test -s "$RUNNER_TEMP/modx-site/core/components/modxmcp/model/modxmcp.class.php"
          test -s "$RUNNER_TEMP/modx-site/assets/components/modxmcp/api.php"
          # Save only a hash, never export the dummy token value in CI logs.
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=modx_build;charset=utf8mb4","modx_ci","ci-throwaway-only-user"); $v=(function() use ($db) { $stmt=$db->prepare("SELECT value FROM modx_system_settings WHERE `key`=?"); $stmt->execute(["modxmcp.api_token"]); return $stmt->fetchColumn(); })(); if(!is_string($v)||strlen($v)!==64)exit(3); file_put_contents(getenv("RUNNER_TEMP")."/previous-token-sha256",hash("sha256",$v));'
          echo "MODX2_PREVIOUS_124_INSTALLED_OK"
      - name: Build real transport ZIP from installed MODX
        env:
          EXPECTED_SIGNATURE: ${{ matrix.signature }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-stage/_build/build.transport.php"
          zip="$RUNNER_TEMP/modx-site/core/packages/$EXPECTED_SIGNATURE.transport.zip"
          test -s "$zip"
          unzip -t "$zip" | tail -3
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$zip" "$RUNNER_TEMP/artifacts/"
          sha256sum "$RUNNER_TEMP/artifacts/"*.zip
      - name: Install and smoke-test transport in disposable MODX
        env:
          EXPECTED_SIGNATURE: ${{ matrix.signature }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-stage/_build/install.transport.php"
          if [ '${{ matrix.platform }}' = 'modx2' ]; then
            test -s "$RUNNER_TEMP/modx-site/core/components/modxmcp/model/modxmcp.class.php"
            test -s "$RUNNER_TEMP/modx-site/core/components/modxmcp/endpoint/api.common.php"
            test -s "$RUNNER_TEMP/modx-site/assets/components/modxmcp/api.php"
            php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=modx_build;charset=utf8mb4","modx_ci","ci-throwaway-only-user"); $v=(function() use ($db) { $stmt=$db->prepare("SELECT value FROM modx_system_settings WHERE `key`=?"); $stmt->execute(["modxmcp.api_token"]); return $stmt->fetchColumn(); })(); if(!is_string($v)||!hash_equals(trim(file_get_contents(getenv("RUNNER_TEMP")."/previous-token-sha256")),hash("sha256",$v)))exit(4);'
            echo "MODX2_REAL_124_TO_125_UPGRADE_FILES_TOKEN_OK"
          fi
          # Only the ephemeral CI database is modified. Regular deployments
          # preserve the production component's default disabled setting.
          # This plain-HTTP change affects ONLY a throwaway localhost CI
          # instance. It is not a runtime or live-site installation default.
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=modx_build;charset=utf8mb4","modx_ci","ci-throwaway-only-user"); $stmt=$db->prepare("UPDATE modx_system_settings SET value=? WHERE `key`=?"); foreach (["modxmcp.enabled"=>"1","modxmcp.require_https"=>"0"] as $key=>$value) { $stmt->execute([$value,$key]); if ($stmt->rowCount()!==1) exit(3); }'
          cat > "$RUNNER_TEMP/refresh-modx-cache.php" <<'PHP'
          <?php
          require getenv('MODX_CONFIG_CORE');
          if (getenv('BUILD_PLATFORM') === 'modx3') {
              require MODX_CORE_PATH . 'vendor/autoload.php';
              $modx = \MODX\Revolution\modX::getInstance();
          } else {
              require MODX_CORE_PATH . 'model/modx/modx.class.php';
              $modx = new modX();
          }
          $modx->initialize('mgr');
          $modx->getCacheManager()->refresh();
          PHP
          BUILD_PLATFORM='${{ matrix.platform }}' php "$RUNNER_TEMP/refresh-modx-cache.php"
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/modx-site"             > "$RUNNER_TEMP/modx-http.log" 2>&1 &
          http_pid=$!
          trap 'kill "$http_pid" 2>/dev/null || true' EXIT
          export MODX_MCP_SMOKE_SITE_URL='http://127.0.0.1:8080'
          for i in {1..25}; do
            if curl --silent --max-time 3 --fail                 "$MODX_MCP_SMOKE_SITE_URL/assets/components/modxmcp/api.php"                 > "$RUNNER_TEMP/modx-health.json"; then break; fi
            sleep 1
          done
          php "$RUNNER_TEMP/modxmcp-stage/_build/smoke.endpoint.php" --read-only
          # An actual HTTP request must be rejected by the installed model
          # when the test-only external authorization setting is enabled.
          BUILD_PLATFORM='${{ matrix.platform }}' php \
            "$RUNNER_TEMP/modxmcp-stage/_build/smoke.protected-boundary.php"
          echo "TEST_TRANSPORT_INSTALL_SMOKE_OK $EXPECTED_SIGNATURE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.signature }}-test-only
          path: ${{ runner.temp }}/artifacts/${{ matrix.signature }}.transport.zip
          if-no-files-found: error
          retention-days: 7
