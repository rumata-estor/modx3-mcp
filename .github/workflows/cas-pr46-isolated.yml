# MODX MCP SOURCE / ИСХОДНИК MODX MCP
# RU: CI-процедура MODX MCP; проверки и сборка не должны менять production.
# EN: MODX MCP CI workflow; testing and packaging must not modify production.
name: CAS PR46 isolated real MODX 2-3 checks (test only)

# Test-only CI: builds are never uploaded, tagged, or published.
# We intentionally leave the 1.2.7 signature unchanged until 1.2.8 release preparation.
on:
  workflow_dispatch:
  push:
    branches: ['feature/1.2.8-cas-pr46-20261121']

permissions:
  contents: read

jobs:
  build:
    name: Disposable ${{ matrix.platform }} / PHP ${{ matrix.php_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # RU: Последняя ветка MODX 2; PHP 7.4 и 8.x тестируем отдельно.
          # EN: Latest MODX 2; test PHP 7.4 and each stable 8.x separately.
          - {platform: modx2, modx_version: '2.8.9', php_version: '7.4', signature: 'modx2mcp-1.2.7-pl'}
          - {platform: modx2, modx_version: '2.8.9', php_version: '8.0', signature: 'modx2mcp-1.2.7-pl'}
          - {platform: modx2, modx_version: '2.8.9', php_version: '8.1', signature: 'modx2mcp-1.2.7-pl'}
          - {platform: modx2, modx_version: '2.8.9', php_version: '8.2', signature: 'modx2mcp-1.2.7-pl'}
          - {platform: modx2, modx_version: '2.8.9', php_version: '8.3', signature: 'modx2mcp-1.2.7-pl'}
          # RU: MODX 3.1 поддерживает PHP 7.4+, но не имеет гарантий для всех новых PHP.
          # EN: MODX 3.1 starts at PHP 7.4; later PHP compatibility is verified empirically.
          - {platform: modx3, modx_version: '3.1.2', php_version: '7.4', signature: 'modx3mcp-1.2.7-pl'}
          - {platform: modx3, modx_version: '3.1.2', php_version: '8.1', signature: 'modx3mcp-1.2.7-pl'}
          - {platform: modx3, modx_version: '3.1.2', php_version: '8.2', signature: 'modx3mcp-1.2.7-pl'}
          # RU: В MODX 3.2 минимальная версия PHP — 8.1.
          # EN: MODX 3.2 requires PHP 8.1 or newer.
          - {platform: modx3, modx_version: '3.2.4', php_version: '8.1', signature: 'modx3mcp-1.2.7-pl'}
          - {platform: modx3, modx_version: '3.2.4', php_version: '8.2', signature: 'modx3mcp-1.2.7-pl'}
          - {platform: modx3, modx_version: '3.2.4', php_version: '8.3', signature: 'modx3mcp-1.2.7-pl'}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway-only-root
          MARIADB_DATABASE: modx_build
          MARIADB_USER: modx_ci
          MARIADB_PASSWORD: ci-throwaway-only-user
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli, pdo_mysql, sodium, zip, gd, intl, mbstring, xml
          coverage: none
      - name: Validate and stage release source
        run: |
          set -euo pipefail
          python3 _build/test.release-staging.py
          python3 _build/test.capabilities-cas-metadata.py
          python3 _build/prepare-release.py --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/modxmcp-stage"
          grep -Fq "define('PKG_VERSION', '1.2.7');" "$RUNNER_TEMP/modxmcp-stage/_build/build.config.php"
          grep -Fq "define('PKG_RELEASE', 'pl');" "$RUNNER_TEMP/modxmcp-stage/_build/build.config.php"
      - name: Install official MODX on disposable CI database
        env:
          MODX_VERSION: ${{ matrix.modx_version }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://modx.s3.amazonaws.com/releases/${MODX_VERSION}/modx-${MODX_VERSION}-pl.zip" \
            -o "$RUNNER_TEMP/modx.zip"
          mkdir -p "$RUNNER_TEMP/modx-extract" "$RUNNER_TEMP/modx-site"
          unzip -q "$RUNNER_TEMP/modx.zip" -d "$RUNNER_TEMP/modx-extract"
          found="$(find "$RUNNER_TEMP/modx-extract" -type f -path '*/setup/index.php' -print -quit)"
          if [ -z "$found" ]; then echo 'MODX setup missing'; exit 1; fi
          root="$(dirname "$(dirname "$found")")"
          cp -a "$root"/. "$RUNNER_TEMP/modx-site/"
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as E
          site=pathlib.Path(os.environ['RUNNER_TEMP'])/'modx-site'
          values={
             'database_type':'mysql','database_server':'127.0.0.1:3306',
             'database':'modx_build','database_user':'modx_ci',
             'database_password':'ci-throwaway-only-user',
             'database_connection_charset':'utf8mb4',
             'database_charset':'utf8mb4','database_collation':'utf8mb4_unicode_ci',
             'table_prefix':'modx_', 'inplace':'1', 'unpacked':'0',
             'language':'en','cmsadmin':'testadmin',
             'cmspassword':'ci-throwaway-admin-only',
             'cmsadminemail':'ci@example.invalid',
             'remove_setup_directory':'0','http_host':'localhost',
             'context_web_path':str(site)+'/', 'context_web_url':'/',
             'core_path':str(site/'core')+'/',
             'context_mgr_path':str(site/'manager')+'/',
             'context_mgr_url':'/manager/',
             'context_connectors_path':str(site/'connectors')+'/',
             'context_connectors_url':'/connectors/',
             'assets_path':str(site/'assets')+'/', 'assets_url':'/assets/',
          }
          parent=E.Element('modx')
          for key,value in values.items():E.SubElement(parent,key).text=value
          E.ElementTree(parent).write(site/'setup/config.xml',encoding='utf-8',xml_declaration=True)
          PY
          (cd "$RUNNER_TEMP/modx-site/setup" && php ./index.php --installmode=new)
          test -f "$RUNNER_TEMP/modx-site/config.core.php"
          test -f "$RUNNER_TEMP/modx-site/core/config/config.inc.php"
      - name: Install historical 1.2.3 on disposable MODX
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modxmcp-v123"
          git archive v1.2.3 | tar -x -C "$RUNNER_TEMP/modxmcp-v123"
          python3 "$RUNNER_TEMP/modxmcp-v123/_build/prepare-release.py" \
            --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/modxmcp-v123-stage"
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-v123-stage/_build/build.transport.php"
          php "$RUNNER_TEMP/modxmcp-v123-stage/_build/install.transport.php" \
            --signature='${{ matrix.platform }}mcp-1.2.3-pl'
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=modx_build;charset=utf8mb4","modx_ci","ci-throwaway-only-user");$s=$db->prepare("SELECT value FROM modx_system_settings WHERE `key`=?");$s->execute(["modxmcp.api_token"]);$v=$s->fetchColumn();if(!is_string($v)||strlen($v)!==64)exit(3);file_put_contents(getenv("RUNNER_TEMP")."/original-token-sha256",hash("sha256",$v));'
          echo "HISTORIC_MODXMCP_123_INSTALLED ${{ matrix.platform }}"
      - name: Build real 1.2.7 transport ZIP on disposable MODX
        env:
          EXPECTED_SIGNATURE: ${{ matrix.signature }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-stage/_build/build.transport.php"
          zip="$RUNNER_TEMP/modx-site/core/packages/$EXPECTED_SIGNATURE.transport.zip"
          test -s "$zip"
          unzip -t "$zip" | tail -3
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$zip" "$RUNNER_TEMP/artifacts/"
          sha256sum "$RUNNER_TEMP/artifacts/"*.zip
      - name: Upgrade historic 1.2.3 to 1.2.7 and verify CAS and preserved token
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          EXPECTED_SIGNATURE: ${{ matrix.signature }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/modxmcp-stage/_build/install.transport.php" --signature="$EXPECTED_SIGNATURE"
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=modx_build;charset=utf8mb4","modx_ci","ci-throwaway-only-user");$s=$db->prepare("SELECT value FROM modx_system_settings WHERE `key`=?");$s->execute(["modxmcp.api_token"]);$v=$s->fetchColumn();if(!is_string($v)||!hash_equals(trim(file_get_contents(getenv("RUNNER_TEMP")."/original-token-sha256")),hash("sha256",$v)))exit(4);echo "TOKEN_PRESERVED\n";'
          BUILD_PLATFORM='${{ matrix.platform }}' php -r '
          require getenv("MODX_CONFIG_CORE");
          if (getenv("BUILD_PLATFORM")==="modx3") {
            require MODX_CORE_PATH."vendor/autoload.php";
            $m=\MODX\Revolution\modX::getInstance();
          } else {
            require MODX_CORE_PATH."model/modx/modx.class.php";
            $m=new modX();
          }
          $m->initialize("mgr");
          require_once MODX_CORE_PATH."components/modxmcp/model/modxmcp.class.php";
          if (modxMCP::VERSION!=="1.2.7")throw new Exception("Wrong installed connector version");
          $api=new modxMCP($m);$state=$api->getSiteState();$cap=$api->getCapabilities();
          if (!$state["atomic_preconditions"] || $state["precondition_version"]!==2 || $cap["features"]["precondition_version"]!==2)
            throw new Exception("CAS v2 mismatch in installed transport");
          echo "INSTALLED_CAS_V2_CONSISTENCY_OK\n";
          '
          echo "MODXMCP_127_UPGRADE_PASS ${{ matrix.platform }} PHP ${{ matrix.php_version }}"
      - name: Ordinary HTTP API functional acceptance without Ed25519
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          TOK="$RUNNER_TEMP/normal-http-api-token"
          PORT=18653
          SERVER_PID=""
          cleanup() {
            php _build/test.ci-normal-http-settings.php disable "$TOK" || true
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            rm -f "$TOK"
          }
          trap cleanup EXIT
          php _build/test.ci-normal-http-settings.php enable "$TOK"
          php -S "127.0.0.1:$PORT" -t "$RUNNER_TEMP/modx-site" \
            "$GITHUB_WORKSPACE/_build/test.ci-protected-http-router.php" \
            > "$RUNNER_TEMP/normal-http-server.log" 2>&1 &
          SERVER_PID=$!
          if ! node _build/test.ci-normal-http.cjs "$TOK" "$PORT"; then
            tail -60 "$RUNNER_TEMP/normal-http-server.log" || true
            exit 1
          fi
      - name: Detached Ed25519 permits verify on MODX2 and MODX3 PHP runtimes
        run: |
          php -r 'if (!function_exists("sodium_crypto_sign_verify_detached")) exit(1);'
          node _build/test.permit-ed25519-interop.cjs
      - name: Ed25519 one-use nonce ledger isolated concurrency and replay
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-permit-nonce-ledger.php
      - name: Provision independent permit ledger on disposable MODX only
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/provision.protected-nonce-ledger.php
      - name: Protected Ed25519 dispatcher integration and bypass tests
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-protected-auth.php
      - name: Protected Ed25519 HTTP endpoint token, TLS, replay, CAS and mutation lifecycle
        env:
          MODXMCP_DISPOSABLE_CI: '1'
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          python3 _build/test.ci-protected-http.py
      - name: Signed Ed25519 authorization through the real MODX HTTP endpoint
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          PRIV="$RUNNER_TEMP/http-ed25519-private.pem"
          PUB="$RUNNER_TEMP/http-ed25519-public.hex"
          TOK="$RUNNER_TEMP/http-api-token"
          PORT=18652
          SERVER_PID=""
          cleanup() {
            php _build/test.ci-protected-http-settings.php disable "$PUB" "$TOK" || true
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            rm -f "$PRIV" "$PUB" "$TOK"
          }
          trap cleanup EXIT
          node _build/test.ci-ed25519-controller.cjs generate "$PRIV" > "$PUB"
          php _build/test.ci-protected-http-settings.php enable "$PUB" "$TOK"
          php -S "127.0.0.1:$PORT" -t "$RUNNER_TEMP/modx-site" \
            "$GITHUB_WORKSPACE/_build/test.ci-protected-http-router.php" \
            > "$RUNNER_TEMP/protected-http-server.log" 2>&1 &
          SERVER_PID=$!
          if ! node _build/test.ci-protected-http.cjs "$PRIV" "$TOK" "$PORT" \
              "ci-http-${{ matrix.platform }}"; then
            tail -60 "$RUNNER_TEMP/protected-http-server.log" || true
            exit 1
          fi
      - name: All 116 mutations require strict CAS; legacy fallback is closed
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-cas-required.php
      - name: PR46 raw TV/CAS integration on disposable MODX and MariaDB
        env:
          MODXMCP_DISPOSABLE_CI: '1'
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-pr46-tv-cas.php
      - name: Probe other database mutation transaction boundaries (disposable)
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-cas-other-mutations.php
      - name: External media, package, token and processor CAS fault matrix
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-external-cas-effects.php
      - name: Fail-closed CAS gate sweep across all registered external mutation actions
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-cas-mutation-gates.php
      - name: Functional acceptance of permitted CAS CRUD and allowlisted processors
        env:
          MODXMCP_DISPOSABLE_CI: '1'
        run: |
          set -euo pipefail
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          php _build/test.ci-functional-acceptance.php
