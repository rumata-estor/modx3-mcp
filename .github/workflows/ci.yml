# MODX MCP SOURCE / ИСХОДНИК MODX MCP
# RU: CI-процедура MODX MCP; проверки и сборка не должны менять production.
# EN: MODX MCP CI workflow; testing and packaging must not modify production.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check (php -l) on every PHP file
        run: |
          php -v
          # _reference/ and modx-example are gitignored (not in the repo); node_modules excluded defensively.
          find . -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bilingual source comments (Russian and English)
        run: python3 _build/test.bilingual-comments.py

      - name: Client syntax check
        run: node --check client/index.js

      - name: Published Node lockfile dependency audit
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate

      - name: Architecture and staging tests
        run: |
          python3 _build/test.architecture.py
          python3 _build/test.build-architecture.py
          python3 _build/test.build-preflight-exit.py
          python3 _build/test.endpoint-architecture.py
          python3 _build/test.modx2-php-compat.py
          python3 _build/test.migration-coverage.py
          python3 _build/test.release-staging.py
          python3 _build/test.manager-platform-package.py
          python3 _build/test.manager-dashboard.py
          python3 _build/test.manager-graph-dashboard.py
          python3 _build/test.docs-localization.py
          python3 _build/test.essential-localization.py

      - name: Multilingual manager localization (9 languages)
        run: |
          node --check assets/components/modxmcp/js/graph.js
          php _build/test.manager-localization.php

      - name: Modular core and platform mapping
        run: |
          php _build/test.modular-core.php
          php _build/test.category-management.php
          php _build/test.platform-mapping.php
          php _build/test.transport-documentation.php

      - name: Release smoke runner shell syntax
        run: bash -n _build/release.smoke.sh

      - name: Release portability / secure defaults
        run: |
          set -euo pipefail
          python3 _build/test.release-portability.py
          for platform in modx2 modx3; do
            stage="$RUNNER_TEMP/modxmcp-security-$platform"
            python3 _build/prepare-release.py --platform "$platform" --output "$stage"
            (cd "$stage" && python3 _build/test.release-portability.py)
          done

      - name: Fail-closed proxy HTTPS and IPv4 allowlist negative tests
        run: |
          python3 _build/test.proxy-https.py
          python3 _build/test.ip-allowlist.py

      - name: Registry dispatcher must fail closed on both MODX platforms
        run: |
          python3 _build/test.registry-fail-closed.py
          python3 _build/test.security-source-wiring.py
          python3 _build/test.http-error-redaction.py
          php _build/test.error-catalog.php
          php _build/test.error-log-lookup.php
          node _build/test.error-presenter.cjs
          php _build/test.secret-redaction-integration.php
          node _build/test.audit-hook-output-isolation.cjs

      - name: Private Controller v4 E2E must refuse non-disposable environments
        run: python3 _build/test.pr50-ci-isolation.py

      - name: Client/server action contract
        run: python3 _build/test.client-server-actions.py

      - name: CAS capability reports agree with authoritative site state
        run: python3 _build/test.capabilities-cas-metadata.py

      - name: PR #46 raw TV CAS regression (AgelxNash)
        run: php _build/test.resource-tv-cas.php
      - name: CAS inventory must classify all 116 mutating API actions
        run: python3 _build/test.cas-mutation-inventory.py
      - name: MCP client schemas must advertise mandatory CAS for all 116 actions
        run: python3 _build/test.cas-client-contract.py
      - name: Strict CAS precondition schema regression
        run: |
          php _build/test.cas-required-contract.php
          php _build/test.cas-raw-resource-date-fingerprint.php
          php _build/test.cas-resource-persisted-fingerprint.php
      - name: Revision transaction failure and after-commit isolation
        run: php _build/test.revision-transaction-faults.php
      - name: ACL, token rotation and protected settings fault isolation
        run: |
          php _build/test.acl-processor-faults.php
          php _build/test.token-rotation-faults.php
          php _build/test.security-settings-immutability.php
          php _build/test.settings-secret-redaction.php
          php _build/test.setting-secret-boundaries.php
          php _build/test.system-setting-rename.php
          php _build/test.property-set-validation.php
          php _build/test.legacy-token-redaction.php modx2
          php _build/test.legacy-token-redaction.php modx3
          php _build/test.user-read-redaction.php
      - name: Exact processor allowlists and privileged mode must fail closed
        run: |
          php _build/test.protected-processor-denial.php
          php _build/test.processor-master-switch.php
          php _build/test.processor-response-shapes.php
          php _build/test.processor-secret-redaction.php
          php _build/test.package-uncertain-result.php
          php _build/test.multi-value-tv.php
          php _build/test.clientconfig-cache.php
          php _build/test.clientconfig-partial-fault.php
          php _build/test.protected-acl-target-cas.php
          php _build/test.p1-acl-policy-stop.php
          php _build/test.log-tail.php
          php _build/test.log-tail-truncation.php
      - name: Independent Ed25519 permit interoperability (no site writes)
        run: |
          php -r 'if (!function_exists("sodium_crypto_sign_verify_detached")) exit(1);'
          node _build/test.permit-ed25519-interop.cjs
      - name: Reject traversal and unsafe media names
        run: |
          php _build/test.media-path-boundaries.php
          php _build/test.media-folder-path-contract.php
          php _build/test.media-custom-driver-boundary.php
          php -d disable_functions=proc_open,exec,shell_exec,system _build/test.media-assets-policy.php
          php _build/test.p1-media-cas-stop.php
          php _build/test.static-element-content-boundaries.php
          php _build/test.static-search-boundary.php
          php _build/test.component-php-read.php
          php -d disable_functions=proc_open,exec,shell_exec,system _build/test.component-php-read.php
          python3 _build/test.component-symlink-race.py
          php _build/test.make-static-symlink-boundary.php
          php _build/test.static-content-postwrite-fault.php
          php _build/test.static-read-failure.php
          php _build/test.static-portable-replace.php
          php -d disable_functions=proc_open,exec,shell_exec,system _build/test.static-portable-replace.php
          php _build/test.static-short-write-fault.php
          php _build/test.replace-across-partial-fault.php
          php _build/test.bulk-resources-partial-fault.php
          php _build/test.tv-exclusive-create-race.php
          php _build/test.static-tv-contract.php
          php _build/test.static-secure-php-bridge.php
          php _build/test.static-secure-failclosed.php
          php _build/test.static-strict-root-boundary.php
          python3 _build/test.static-toctou-race.py
          python3 _build/test.static-atomic-short-write.py
          php _build/test.tv-relation-save-faults.php
          php _build/test.tv-schema-validation.php

      # RU: Только одноразовая runner FS, не рабочие сайты.
      # EN: Disposable filesystem metadata regression gate, no real sites.
      - name: Static file owner/mode/POSIX ACL/xattr integrity
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl
          python3 _build/test.static-metadata-integrity.py
          php _build/test.static-portable-metadata.php

      - name: Strict miniShop2 product-link IDs before addon SQL
        run: php _build/test.ms2-productlink-strict-ids.php

      - name: miniShop2 order partial-write and lost-response fail-closed
        run: php _build/test.ms2-order-uncertain-fault.php

      - name: VersionX native revert outcome and error isolation
        run: php _build/test.versionx-revert-uncertain-fault.php

      - name: miniShop2 native category partial-write fail-closed
        run: php _build/test.ms2-category-uncertain-fault.php

      - name: Version consistency across shared, MODX 2 and MODX 3 metadata
        run: |
          MODX3_PKG=$(php -r "include '_build/build.config.php'; echo PKG_VERSION;")
          MODX2_PKG=$(php -r "include '_build/platform/modx2/overlay/_build/build.config.php'; echo PKG_VERSION;")
          NPM=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          MODX3_MODEL=$(php -r "require 'core/components/modxmcp/model/modxmcp.class.php'; echo modxMCP::VERSION;")
          MODX2_MODEL=$(php -r "require 'core/components/modxmcp/legacy/modx2/modxmcp.class.php'; echo modxMCP::VERSION;")
          echo "modx3=$MODX3_PKG  modx2=$MODX2_PKG  package.json=$NPM  package-lock.json=$LOCK  modx3-model=$MODX3_MODEL  modx2-model=$MODX2_MODEL"
          if [ "$MODX3_PKG" != "$NPM" ] || [ "$MODX2_PKG" != "$NPM" ] || [ "$NPM" != "$LOCK" ] || [ "$LOCK" != "$MODX3_MODEL" ] || [ "$MODX3_MODEL" != "$MODX2_MODEL" ]; then
            echo "::error::Version mismatch across shared / MODX 2 / MODX 3 release metadata"
            exit 1
          fi

      - name: English and Russian CHANGELOGs have the current version
        run: |
          PKG=$(php -r "include '_build/build.config.php'; echo PKG_VERSION;")
          for FILE in CHANGELOG.md CHANGELOG.ru.md; do
            if ! grep -q "## ${PKG} " "$FILE"; then
              echo "::error::$FILE has no '## ${PKG}' entry"
              exit 1
            fi
          done
          echo "Both CHANGELOG files have an entry for ${PKG}."


  modx3-processors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modx_ref: [v3.2.2-pl, v3.2.4-pl, 3.x]
    steps:
      - uses: actions/checkout@v4

      - name: Check MODX 3 processor compatibility
        run: |
          git clone --depth 1 --branch "${{ matrix.modx_ref }}" https://github.com/modxcms/revolution.git "$RUNNER_TEMP/modx"
          php _build/test.modx3-processors.php "$RUNNER_TEMP/modx/core/src/Revolution/Processors"
