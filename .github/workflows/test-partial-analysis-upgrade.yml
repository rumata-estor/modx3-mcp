# MODX MCP SOURCE / ИСХОДНИК MODX MCP
# RU: Сборка тестового транспорта и проверка обновления с Beta 5 на одноразовом MODX.
# EN: Disposable Beta 5 upgrade and downloadable test transport, never a release.
name: Test partial-analysis upgrade from Beta 5
on:
  workflow_dispatch:
  push:
    branches: ['fix/beta5-partial-dependency-analysis-20261124']
    paths:
      - 'core/**'
      - 'assets/**'
      - '_build/test.ci-partial-analysis-upgrade.php'
      - '.github/workflows/test-partial-analysis-upgrade.yml'
permissions:
  contents: read
jobs:
  upgrade:
    name: Upgrade Beta 5 on ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: modx2, modx_version: '2.8.9'}
          - {platform: modx3, modx_version: '3.2.4'}
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      MODXMCP_DISPOSABLE_CI: '1'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway-only-root
          MARIADB_DATABASE: modx_build
          MARIADB_USER: modx_ci
          MARIADB_PASSWORD: ci-throwaway-only-user
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, sodium, zip, gd, intl, mbstring, xml
          coverage: none
      - name: Install official MODX on disposable CI database
        env:
          MODX_VERSION: ${{ matrix.modx_version }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://modx.s3.amazonaws.com/releases/${MODX_VERSION}/modx-${MODX_VERSION}-pl.zip" \
            -o "$RUNNER_TEMP/modx.zip"
          mkdir -p "$RUNNER_TEMP/modx-extract" "$RUNNER_TEMP/modx-site"
          unzip -q "$RUNNER_TEMP/modx.zip" -d "$RUNNER_TEMP/modx-extract"
          found="$(find "$RUNNER_TEMP/modx-extract" -type f -path '*/setup/index.php' -print -quit)"
          if [ -z "$found" ]; then echo 'MODX setup missing'; exit 1; fi
          root="$(dirname "$(dirname "$found")")"
          cp -a "$root"/. "$RUNNER_TEMP/modx-site/"
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as E
          site=pathlib.Path(os.environ['RUNNER_TEMP'])/'modx-site'
          values={
             'database_type':'mysql','database_server':'127.0.0.1:3306',
             'database':'modx_build','database_user':'modx_ci',
             'database_password':'ci-throwaway-only-user',
             'database_connection_charset':'utf8mb4',
             'database_charset':'utf8mb4','database_collation':'utf8mb4_unicode_ci',
             'table_prefix':'modx_', 'inplace':'1', 'unpacked':'0',
             'language':'en','cmsadmin':'testadmin',
             'cmspassword':'ci-throwaway-admin-only',
             'cmsadminemail':'ci@example.invalid',
             'remove_setup_directory':'0','http_host':'localhost',
             'context_web_path':str(site)+'/', 'context_web_url':'/',
             'core_path':str(site/'core')+'/',
             'context_mgr_path':str(site/'manager')+'/',
             'context_mgr_url':'/manager/',
             'context_connectors_path':str(site/'connectors')+'/',
             'context_connectors_url':'/connectors/',
             'assets_path':str(site/'assets')+'/', 'assets_url':'/assets/',
          }
          parent=E.Element('modx')
          for key,value in values.items():E.SubElement(parent,key).text=value
          E.ElementTree(parent).write(site/'setup/config.xml',encoding='utf-8',xml_declaration=True)
          PY
          (cd "$RUNNER_TEMP/modx-site/setup" && php ./index.php --installmode=new)
          test -f "$RUNNER_TEMP/modx-site/config.core.php"
          test -f "$RUNNER_TEMP/modx-site/core/config/config.inc.php"
      - name: Build the pinned installed Beta 5 and test-only upgrade transport
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beta5-source" "$RUNNER_TEMP/artifact"
          git archive 14813df301dbeafc3085067f98ed8759e042a6aa | tar -x -C "$RUNNER_TEMP/beta5-source"
          python3 "$RUNNER_TEMP/beta5-source/_build/prepare-release.py" --platform "$BUILD_PLATFORM" --output "$RUNNER_TEMP/old"
          python3 _build/prepare-release.py --platform "$BUILD_PLATFORM" --output "$RUNNER_TEMP/new"
          python3 - <<'PY_STAMP'
          import os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          for directory, release in [('old','beta5'),('new','beta6')]:
              root=temp/directory
              for path, old, new in [(root/'_build/build.config.php', "define('PKG_VERSION', '1.2.7');", "define('PKG_VERSION', '1.2.8');"), (root/'_build/build.config.php', "define('PKG_RELEASE', 'pl');", "define('PKG_RELEASE', '"+release+"');"), (root/'core/components/modxmcp/model/modxmcp.class.php', "const VERSION = '1.2.7';", "const VERSION = '1.2.8';")]:
                  text=path.read_text()
                  if text.count(old)!=1: raise RuntimeError('Version marker mismatch')
                  path.write_text(text.replace(old,new))
          PY_STAMP
          export MODX_CONFIG_CORE="$RUNNER_TEMP/modx-site/config.core.php"
          export MODX_DOCUMENT_ROOT="$RUNNER_TEMP/modx-site"
          php "$RUNNER_TEMP/old/_build/build.transport.php"
          php "$RUNNER_TEMP/old/_build/install.transport.php" --signature="${BUILD_PLATFORM}mcp-1.2.8-beta5"
          php _build/test.ci-partial-analysis-upgrade.php before
          php "$RUNNER_TEMP/new/_build/build.transport.php"
          archive="$RUNNER_TEMP/modx-site/core/packages/${BUILD_PLATFORM}mcp-1.2.8-beta6.transport.zip"
          cp "$archive" "$RUNNER_TEMP/artifact/"
          unzip -t "$archive" | tail -2
          php "$RUNNER_TEMP/new/_build/install.transport.php" --signature="${BUILD_PLATFORM}mcp-1.2.8-beta6"
          php _build/test.ci-partial-analysis-upgrade.php after
          (cd "$RUNNER_TEMP/artifact" && sha256sum *.transport.zip > SHA256SUMS && printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT)
      - name: Upload only successfully verified test transport (no release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-1.2.8-beta6-test-only
          path: ${{ runner.temp }}/artifact/*
          if-no-files-found: error
          retention-days: 14
